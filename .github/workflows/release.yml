name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Publish
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./publish.ps1 -Zip -Version $version
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/MakinoMCP-*-win-x64.zip
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem artifacts -Filter 'MakinoMCP-*-win-x64.zip' | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $zip.FullName "$($zip.FullName).sha256" --title $env:GITHUB_REF_NAME --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
