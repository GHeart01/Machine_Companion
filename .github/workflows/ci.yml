name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore MakinoMCP.slnx
      - name: Build
        run: dotnet build MakinoMCP.slnx --no-restore -c Release
      - name: Test
        run: dotnet test MakinoMCP.slnx --no-build -c Release
      - name: Check for private names
        shell: pwsh
        run: ./scripts/check-private.ps1 -Patterns $env:PRIVATE_PATTERNS
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
